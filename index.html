<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="icon" type="image/png" href="chrome://branding/content/about-logo.png">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Google Sans Flex', system-ui, -apple-system, sans-serif;
        }

        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: opacity 0.6s cubic-bezier(0.455, 0.03, 0.515, 0.955), filter 0.3s ease;
            opacity: 0; z-index: 1;
        }
        .bg-layer.active { opacity: 1; z-index: 2; }

        .content {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100%; width: 100%;
        }

        .logo {
            width: 120px; height: auto; margin-bottom: 40px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.4));
            user-select: none; -webkit-user-drag: none; transition: all 0.3s ease;
        }

        .search-container { width: 100%; max-width: 600px; padding: 0 20px; box-sizing: border-box; position: relative; }
        .search-wrapper { position: relative; width: 100%; display: flex; align-items: center; z-index: 20; }

        .search-bar {
            width: 100%; padding: 16px 28px 16px 60px; font-size: 1.2rem; color: #ffffff;
            background: rgba(30, 30, 40, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            outline: none; transition: all 0.3s ease; font-family: inherit; box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .input-stack { position: relative; width: 100%; display: flex; }
        
        #autocompleteOverlay { 
            position: absolute; top: 0; left: 0; z-index: 1; 
            color: rgba(255, 255, 255, 0.3); pointer-events: none; 
        }
        #autocompleteOverlay::placeholder { color: transparent; }
        
        #searchInput { 
            position: relative; z-index: 2; 
            background: transparent !important; backdrop-filter: none !important; 
            -webkit-backdrop-filter: none !important; box-shadow: none !important; 
            border-color: transparent !important; 
        }
        #searchInput::placeholder { color: rgba(255, 255, 255, 0.6); }

        .input-stack:has(#searchInput:focus) #autocompleteOverlay { 
            background: rgba(30, 30, 40, 0.6); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4); 
        }
        .input-stack:has(#searchInput.has-suggestions) #autocompleteOverlay { 
            border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; 
        }
        .input-stack:has(#searchInput.error-state) #autocompleteOverlay { 
            border-color: rgba(255, 85, 85, 0.5); background: rgba(40, 20, 20, 0.6); 
        }
        #searchInput.error-state { color: #ff5555; font-family: monospace; }

        .suggestions-dropdown {
            position: absolute; top: 100%; left: 20px; right: 20px; margin-top: -12px;
            background: rgba(30, 30, 40, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: none; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); overflow: hidden;
            opacity: 0; visibility: hidden; transition: all 0.2s ease; z-index: 19;
            padding-top: 16px;
        }
        .suggestions-dropdown.show { opacity: 1; visibility: visible; }
        .suggestion-item {
            padding: 12px 24px; color: rgba(255,255,255,0.8); font-size: 1.05rem;
            cursor: pointer; transition: background 0.2s, color 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .suggestion-item svg { width: 16px; height: 16px; opacity: 0.5; }
        .suggestion-item:hover, .suggestion-item.selected {
            background: rgba(255, 255, 255, 0.1); color: #fff;
        }

        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        .search-wrapper:has(#searchInput.loading)::before,
        .search-wrapper:has(#searchInput.loading)::after {
            content: ''; position: absolute; inset: 0; border-radius: 40px; 
            background: conic-gradient(from var(--angle), #1e1e1f, #8e918f, #e3e3e3, #8e918f, #1e1e1f);
            animation: spin-grayscale 2.5s linear infinite; pointer-events: none;
        }
        .search-wrapper:has(#searchInput.loading)::before {
            padding: 1.5px; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; z-index: 2; 
        }
        .search-wrapper:has(#searchInput.loading)::after { filter: blur(12px); opacity: 0.35; z-index: -1; }
        @keyframes spin-grayscale { from { --angle: 0deg; } to { --angle: 360deg; } }

        .provider-toggle {
            position: absolute; left: 20px; width: 24px; height: 24px; cursor: pointer;
            z-index: 25; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease;
        }
        .provider-toggle:hover { transform: scale(1.1); }
        .provider-toggle img { width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        .provider-dropdown {
            position: absolute; top: 60px; left: 0; background: rgba(30, 30, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            list-style: none; padding: 8px 0; margin: 0; width: 180px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; z-index: 30;
        }
        .provider-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .provider-dropdown li { padding: 12px 20px; color: #fff; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s ease; font-size: 1rem; }
        .provider-dropdown li:hover { background: rgba(255, 255, 255, 0.1); }
        .provider-dropdown li img { width: 20px; height: 20px; object-fit: contain; }

        .bookmarks-container { display: flex; justify-content: center; gap: 12px; margin-top: 32px; width: 100%; max-width: 600px; padding: 0 20px; box-sizing: border-box; min-height: 60px; }
        .bookmark-item {
            flex: 1; max-width: 60px; aspect-ratio: 1 / 1; border-radius: 16px; 
            background: rgba(30, 30, 40, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .bookmark-item:hover { transform: translateY(-4px); background: rgba(30, 30, 40, 0.6); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); }
        .bookmark-item img { width: 28px; height: 28px; object-fit: contain; border-radius: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        .settings-btn {
            position: fixed; bottom: 24px; right: 24px; width: 44px; height: 44px;
            background: rgba(30, 30, 40, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex;
            align-items: center; justify-content: center; cursor: pointer; z-index: 60;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); padding: 0;
        }
        .settings-btn:hover { background: rgba(30, 30, 40, 0.7); transform: rotate(45deg); }
        .settings-btn svg { width: 22px; height: 22px; fill: #ffffff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    </style>
</head>
<body>

    <div id="bg1" class="bg-layer active"></div>
    <div id="bg2" class="bg-layer"></div>

    <div class="content">
        <img id="mainLogo" src="chrome://branding/content/about-logo.png" alt="Logo" class="logo">

        <form id="searchForm" class="search-container" action="https://www.startpage.com/sp/search" method="POST">
            
            <button type="submit" style="display: none;"></button>

            <div class="search-wrapper">
                <div class="provider-toggle" id="providerToggle" title="Change Search Engine">
                    <img id="activeProviderIcon" src="https://cdn.simpleicons.org/startpage/white" alt="Startpage">
                </div>

                <ul class="provider-dropdown" id="providerDropdown">
                    <li data-provider="startpage"><img src="https://cdn.simpleicons.org/startpage/white" alt="Startpage">Startpage</li>
                    <li data-provider="google"><img src="https://cdn.simpleicons.org/google/white" alt="Google">Google</li>
                    <li data-provider="duckduckgo"><img src="https://cdn.simpleicons.org/duckduckgo/white" alt="DuckDuckGo">DuckDuckGo</li>
                    <li data-provider="gemini"><img src="https://cdn.simpleicons.org/googlegemini/white" alt="Gemini">Gemini</li>
                </ul>

                <div class="input-stack">
                    <input type="text" id="autocompleteOverlay" class="search-bar" readonly tabindex="-1">
                    <input type="text" id="searchInput" name="query" class="search-bar" placeholder="Search the web..." autofocus autocomplete="off">
                </div>
            </div>
            
            <div id="suggestionsDropdown" class="suggestions-dropdown">
            </div>
        </form>

        <div id="bookmarksContainer" class="bookmarks-container"></div>
    </div>

    <a href="/settings" class="settings-btn" title="Startpage Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

        </svg>
    </a>

    <script src="script.js"></script>
</body>
</html>
